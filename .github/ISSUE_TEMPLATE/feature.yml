name: Feature
description: A feature from the specification (one issue per feature ID).
title: "<ID> – <Feature>"
labels: ["feature"]
body:
  - type: input
    id: feature-id
    attributes:
      label: Feature ID
      description: ID from the Features section of docs/specification.md (e.g. D3).
      placeholder: D3
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Module from the "Incremental module plan". Also add the matching module-N label.
      options:
        - "1. Domain core"
        - "2. Generator and package"
        - "3. FHIR definitions and validation"
        - "4. Platform"
        - "5. Source"
        - "6. Roles and references"
        - "7. Mapping grid"
        - "8. Value maps and terminology"
        - "9. Export and acceptance"
        - "After the MVP"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - MVP
        - V2
        - Future
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Detail
      description: The feature's detail from the specification, plus anything agreed since.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How a reviewer can tell the feature works (tests, commands, screens).
