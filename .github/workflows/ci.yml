name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Version used to verify fixtures/fml-examples (see its README). Digest published by GitHub for the release asset.
  VALIDATOR_VERSION: 7.0.5
  VALIDATOR_SHA256: 9dfe9f305b0f9389eceade2a4a1c9a2740d7b0e614066fdf07a78b571c76d92f

jobs:
  fixtures:
    name: Fixtures checksum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify fixtures/fml-examples against fixtures/fml-examples.sha256
        run: sha256sum --check --strict --quiet fixtures/fml-examples.sha256

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Apps import the domain packages through their dist/ exports, so build those first.
      - name: Build the domain packages
        run: pnpm --filter "./packages/*" build
      - run: pnpm format:check
      - run: pnpm lint
      - name: Package boundaries (ADR-0001)
        run: pnpm boundaries

  typecheck:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Apps import the domain packages through their dist/ exports, so build those first.
      - name: Build the domain packages
        run: pnpm --filter "./packages/*" build
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Apps import the domain packages through their dist/ exports, so build those first.
      - name: Build the domain packages
        run: pnpm --filter "./packages/*" build
      - name: Unit tests with coverage thresholds
        run: pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: .tmp/coverage
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

  golden:
    name: Golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The second golden pass runs the maps produced by the generator (tooling/golden/generate-maps.mjs).
      - name: Build the domain packages
        run: pnpm --filter "./packages/*" build
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache HL7 validator and FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .fhir/validator
            ~/.fhir/packages
          key: hl7-validator-${{ env.VALIDATOR_VERSION }}-r4core-4.0.1
      - name: Download and verify the HL7 validator
        run: |
          jar=.fhir/validator/validator_cli-$VALIDATOR_VERSION.jar
          if [ ! -f "$jar" ]; then
            mkdir -p .fhir/validator
            curl -fsSL -o "$jar" \
              "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/$VALIDATOR_VERSION/validator_cli.jar"
          fi
          echo "$VALIDATOR_SHA256  $jar" | sha256sum --check --strict
          echo "VALIDATOR=$PWD/$jar" >> "$GITHUB_ENV"
      - name: Run the verified examples and the generated maps (fixtures/fml-examples)
        run: bash tooling/golden/run-examples.sh
      - name: Validate the FHIR resources of the examples (0 errors)
        run: bash tooling/golden/validate-resources.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-output
          path: .tmp/golden
          retention-days: 14

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the development stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Keycloak login, test user sign-in, web app and API through the web proxy
        run: bash tooling/compose/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
