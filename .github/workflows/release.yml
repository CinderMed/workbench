name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.product.outputs.released }}
      version: ${{ steps.product.outputs.version }}
      tag: ${{ steps.product.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # With pending changesets: open or update the "Version Packages" PR.
      # RELEASE_TOKEN (optional) lets that PR trigger the CI checks; with the default
      # GITHUB_TOKEN it does not, and an admin merges it after checking it (ADR-0003).
      - name: Version Packages pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2 (Changesets CLI v3)
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          commit-message: "chore(infra): version packages"
          pr-title: "chore(infra): version packages"
          create-github-releases: false
          push-git-tags: false
      # Without pending changesets (e.g. right after that PR is merged): tag vX.Y.Z and
      # create the GitHub Release, once per product version.
      - name: Product tag and GitHub Release
        id: product
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/release/product-release-cli.ts

  images:
    name: Docker images
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: X.Y.Z and sha-<commit>; latest only for stable releases (specification, "Versions and releases").
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/cindermed/workbench-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ !contains(needs.release.outputs.version, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
