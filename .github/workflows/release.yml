name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.product.outputs.released }}
      version: ${{ steps.product.outputs.version }}
      tag: ${{ steps.product.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # With pending changesets: open or update the "Version Packages" PR.
      # RELEASE_TOKEN (optional) lets that PR trigger the CI checks; with the default
      # GITHUB_TOKEN it does not, and an admin merges it after checking it (ADR-0003).
      - name: Version Packages pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm version-packages
          commit: "chore(infra): version packages"
          title: "chore(infra): version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # Without pending changesets (e.g. right after that PR is merged): tag vX.Y.Z and
      # create the GitHub Release, once per product version.
      - name: Product tag and GitHub Release
        id: product
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/release/product-release-cli.ts
